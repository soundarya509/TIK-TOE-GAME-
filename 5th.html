<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tic Tac Toe</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #eaf0fa 0%, #cfd9e6 100%);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .container {
      margin-top: 40px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 8px 32px rgba(60, 80, 120, 0.18);
      padding: 40px 32px 32px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 340px;
      max-width: 96vw;
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      margin-bottom: 18px;
      object-fit: cover;
      border: 2px solid #e0e7ef;
      box-shadow: 0 2px 8px rgba(60, 80, 120, 0.08);
      background: #f6f8fb;
    }
    h1 {
      margin: 0 0 12px 0;
      font-size: 2.2rem;
      color: #2d3a53;
      letter-spacing: 1px;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(60, 80, 120, 0.08);
    }
    .subtitle {
      color: #6c7a96;
      font-size: 1.05rem;
      margin-bottom: 18px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 80px);
      grid-template-rows: repeat(3, 80px);
      gap: 10px;
      margin: 24px 0 18px 0;
      background: #eaf0fa;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(60, 80, 120, 0.07);
      padding: 12px;
    }
    .cell {
      width: 80px;
      height: 80px;
      background: #f6f8fb;
      border-radius: 10px;
      font-size: 2.7rem;
      color: #3a4a6b;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.18s, box-shadow 0.18s;
      user-select: none;
      box-shadow: 0 1px 4px rgba(60, 80, 120, 0.04);
      border: 2px solid transparent;
    }
    .cell:hover {
      background: #d4e2fc;
      border: 2px solid #a6b8e6;
      box-shadow: 0 2px 8px rgba(60, 80, 120, 0.10);
    }
    .cell.winner {
      background: #c1e7e3;
      color: #1c6b6b;
      border: 2px solid #1c6b6b;
      box-shadow: 0 2px 12px rgba(28, 107, 107, 0.12);
    }
    .status {
      font-size: 1.18rem;
      margin-bottom: 10px;
      color: #2d3a53;
      min-height: 28px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-align: center;
    }
    .reset-btn {
      background: linear-gradient(90deg, #3a4a6b 60%, #6c7a96 100%);
      color: #fff;
      border: none;
      padding: 12px 34px;
      border-radius: 8px;
      font-size: 1.08rem;
      cursor: pointer;
      margin-top: 10px;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(60, 80, 120, 0.10);
      transition: background 0.2s, box-shadow 0.2s;
    }
    .reset-btn:hover {
      background: linear-gradient(90deg, #2d3a53 60%, #3a4a6b 100%);
      box-shadow: 0 4px 16px rgba(60, 80, 120, 0.18);
    }
    @media (max-width: 500px) {
      .container { padding: 18px 4vw; }
      .board { grid-template-columns: repeat(3, 18vw); grid-template-rows: repeat(3, 18vw); padding: 4vw; }
      .cell { width: 18vw; height: 18vw; font-size: 2rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <img class="logo" src="1st.jpg" alt="Logo">
    <h1>Tic Tac Toe</h1>
    <div class="subtitle">Two players take turns. First to align three wins!</div>
    <div class="status" id="status"></div>
    <div class="board" id="board"></div>
    <button class="reset-btn" onclick="resetGame()">Restart Game</button>
  </div>
  <script>
    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    let board = Array(9).fill('');
    let currentPlayer = 'X';
    let gameActive = true;
    let winnerPattern = [];

    function renderBoard() {
      boardEl.innerHTML = '';
      board.forEach((cell, idx) => {
        const cellEl = document.createElement('div');
        cellEl.className = 'cell';
        cellEl.textContent = cell;
        if (winnerPattern.includes(idx)) cellEl.classList.add('winner');
        cellEl.addEventListener('click', () => handleCellClick(idx));
        boardEl.appendChild(cellEl);
      });
    }

    function handleCellClick(idx) {
      if (!gameActive || board[idx]) return;
      board[idx] = currentPlayer;
      renderBoard();
      const win = checkWinner(currentPlayer);
      if (win) {
        winnerPattern = win;
        renderBoard();
        statusEl.textContent = `Player ${currentPlayer} wins! 🎉`;
        gameActive = false;
      } else if (board.every(cell => cell)) {
        statusEl.textContent = "It's a draw!";
        gameActive = false;
      } else {
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        statusEl.textContent = `Player ${currentPlayer}'s turn`;
      }
    }

    function checkWinner(player) {
      const winPatterns = [
        [0,1,2],[3,4,5],[6,7,8], // rows
        [0,3,6],[1,4,7],[2,5,8], // cols
        [0,4,8],[2,4,6]          // diags
      ];
      for (let pattern of winPatterns) {
        if (pattern.every(idx => board[idx] === player)) return pattern;
      }
      return null;
    }

    function resetGame() {
      board = Array(9).fill('');
      currentPlayer = 'X';
      gameActive = true;
      winnerPattern = [];
      statusEl.textContent = `Player ${currentPlayer}'s turn`;
      renderBoard();
    }

    // Initial render
    resetGame();
  </script>
</body>
</html>
